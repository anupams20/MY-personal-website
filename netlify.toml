# Netlify config. No build step — the files are served as they are.
[build]
  publish = "."

# ---- security headers ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # SAMEORIGIN, not DENY: the Work section previews the demo pages in iframes.
    X-Frame-Options = "SAMEORIGIN"

# ---- caching ----
# HTML revalidates every time, so a deploy is visible immediately.
# This is what prevents the stale-script problem we hit in local testing.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS and JS are versioned in the markup (style.css?v=3), so they can be
# cached hard — bump the ?v= number when you change them.
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
