# Netlify config. No build step — the files are served as they are.
[build]
  publish = "."

# ---- internal folders: never serve in production ----
[[redirects]]
  from = "/_review/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/shots/*"
  to = "/404.html"
  status = 404

# ---- security headers ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    # SAMEORIGIN, not DENY: the Work section previews the demo pages in iframes.
    X-Frame-Options = "SAMEORIGIN"
    # HTML (including extensionless pretty URLs like /about) revalidates every
    # time, so a deploy is visible immediately. Asset rules below override this.
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- caching: versioned assets cache hard (bump ?v= on change) ----
[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/i18n.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
